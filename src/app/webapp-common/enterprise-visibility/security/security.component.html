<h1>在整个组织中确保管控、一致性与合规性</h1>
<div class="sub-title">
  让管理员集中配置运行参数并实施合规策略，从而提升整体效率。
</div>

<div class="section">
  <div class="details">
    <h2>配置保管库</h2>
    管理员设置的值可以扩展或覆盖用户配置，便于统一下发所需配置并集中管理安全敏感密钥。
  </div>
  <div class="image" (click)="imageClicked(image1)">
    <img
      [ngSrc]="'app/webapp-common/assets/marketing/admin-vaults-fhd-' + theme() + '.png'"
      #image1
      width="640"
      height="360"
      alt="vaults"
    >
  </div>
</div>

<div class="section">
  <div class="image" (click)="imageClicked(image2)">
    <img
      [ngSrc]="'app/webapp-common/assets/marketing/service-accounts-fhd-' + theme() + '.png'"
      #image2
      width="640"
      height="360"
      alt="Service accounts"
    >
  </div>
  <div class="details">
    <h2>服务账号</h2>
    为自动化流程和应用提供安全、可管理的 API 访问能力，无需依赖个人用户凭证，从而简化自动化管理。
  </div>
</div>
<div class="section">
  <div class="details">
    <h2>访问控制</h2>
    对任意资源设置细粒度访问权限，通过明确谁可以访问项目、数据集、模型和执行队列来保障协作数据安全。
  </div>
  <div class="image" (click)="imageClicked(image3)">
    <img
      [ngSrc]="'app/webapp-common/assets/marketing/rbac-fhd-' + theme() + '.png'"
      #image3
      width="640"
      height="360"
      alt="RBAC"
    >
  </div>
</div>

<div class="section">
  <div class="image" (click)="imageClicked(image4)">
    <img
      [ngSrc]="'app/webapp-common/assets/marketing/idp-fhd-' + theme() + '.png'"
      #image4
      width="640"
      height="360"
      alt="Idp sso"
    >
  </div>
  <div class="details">
    <h2>身份提供方</h2>
    与组织现有的 SAML/OIDC 身份提供方集成，实现更顺畅的用户认证与访问控制。
  </div>
</div>
<div class="cta">
  <a href="https://clear.ml/contact-us" target="_blank" class="cta-button">
    <mat-icon fontSet="al" fontIcon="al-ico-bullhorn"></mat-icon>联系我们</a>
</div>

@if (!showButton()) {
  <sm-dialog-template iconClass="al-ico-datasets" header="创建新数据集">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </sm-dialog-template>
} @else {
  <ng-container *ngTemplateOutlet="content"></ng-container>
}
<ng-template #content>
  <div class="content">
    <div class="code">
      <p>
        可通过 CLI 或 Python 代码使用 ClearML Data。<br>
        运行以下代码片段即可快速体验（需要 ClearML 1.7 或更高版本）。<br>
        更多详情请参阅<a [class.dark]="showButton()" [href]="confService.configuration().docsLink + '/latest/docs/clearml_data'" target="_blank" data-id="documentationLink">文档</a>
      </p>
      <div class="navbar">
        <mat-tab-group [(selectedIndex)]="index">
          <mat-tab label="CLI" data-id="CLITab"></mat-tab>
          <mat-tab label="SDK" data-id="SDKTab"></mat-tab>
        </mat-tab-group>
      </div>
      @if (showCode()) {
        <sm-code-editor
          [code]="emptyStateTab() === 'cli' ? initDatasetCLICode: initDatasetSDKCode"
          [readonly]="true"
          [mode]="emptyStateTab() === 'cli' ? 'sh': 'python'"
          [showCopyButton]="true"
        ></sm-code-editor>
      }
    </div>
    <div class="diagram"><i class="i-datasets-empty-state" data-id="emptyDataSetDiagram"></i></div>
  </div>
</ng-template>

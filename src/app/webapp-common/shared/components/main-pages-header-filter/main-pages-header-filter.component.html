<button mat-icon-button class='cell' [matMenuTriggerFor]="menu" #trigger="matMenuTrigger" [class.menu-opened]="trigger.menuOpen" (menuOpened)="menuOpen()">
  <mat-icon fontSet="al" [fontIcon]="(showOnlyUserWork() ||  (tagsFilters()?.length > 0) || (usersFilters()?.length > 0)? 'al-ico-filter-on' : 'al-ico-filter-off')">
    <span class="path1" data-id="FilterMenuIcon"></span><span class="path2"></span>
  </mat-icon>
</button>

<mat-menu #menu="matMenu" (closed)="closeMenu()">
  <button mat-menu-item smClickStopPropagation (click)="switchUserFocus()">
    <mat-icon matIconPrefix fontSet="al" [fontIcon]="showOnlyUserWork() ? 'al-ico-success' : ''" data-id="MyworkCheckbox"></mat-icon>
    <div data-id="MyWorkFilterOption">我的工作</div>
  </button>
  <button mat-menu-item [matMenuTriggerFor]="subMenu" (menuOpened)="tagsFilterOpened()">
    <mat-icon matIconPrefix fontSet="al"
              [fontIcon]="!(tagsFilters()?.length > 0) ? '' : 'al-ico-success'"
              data-id="TagCheckbox"
    ></mat-icon>
    <span data-id="TagOption">标签</span>
  </button>
  <button mat-menu-item [matMenuTriggerFor]="usersSubMenu?.smMenu()?.menu()" [disabled]="showOnlyUserWork()" (menuOpened)="usersFilterOpened()">
    <mat-icon matIconPrefix fontSet="al"
              [fontIcon]="!(usersFilters()?.length > 0) ? '' : 'al-ico-success'"
              data-id="TagCheckbox"
    ></mat-icon>
    <span data-id="TagOption">用户</span>
  </button>

  <mat-menu #subMenu="matMenu" class="table-card-filter-menu light-theme"  (close)="closeMenu()">
    <form class="filter-form">
      <mat-form-field appearance="fill"  smClickStopPropagation class="tags-menu-input w-100 no-bottom">
        <input matInput (input)="setSearchTerm($event)" name="filter" [(ngModel)]="searchTerm" autocomplete="off">
        @if (searchTerm) {
          <button matSuffix mat-icon-button (click)="clearSearch()" data-id="TagsearchIcon">
            <mat-icon fontSet="al" fontIcon="al-ico-dialog-x"></mat-icon>
          </button>
        } @else {
          <mat-icon matIconSuffix fontSet="al" fontIcon="al-ico-search"></mat-icon>
        }
      </mat-form-field>
    </form>
    <div class="filter-type" smClickStopPropagation>
      <button mat-button data-id="AnyTagOption" class="link" [class.selected]="matchMode() !== 'AND'" (click)="toggleMatch()">任意</button>
      <button mat-button data-id="allTagOption" class="link" [class.selected]="matchMode() === 'AND'" (click)="toggleMatch()">全部</button>
    </div>
    <div class="results scroll"  smClickStopPropagation>
      <sm-checkbox-three-state-list
        [supportExcludeFilter]="true"
        [checkedList]="tagsFilters()"
        [options]="tagsLabelValue() | filter : searchTerm: 'label'"
        (filterChanged)="emitFilterChangedCheckBox($event)"
      > </sm-checkbox-three-state-list>
    </div>
    @if (tagsLabelValue()?.length>0) {
      <div class="column-explanation">点击一次包含标签，再次点击则排除。</div>
    }
  </mat-menu>
  <sm-table-filter-sort #usersSubMenu
                        (filterChanged)="emitUsersFilterChangedCheckBox($event)"
                        (searchValueChanged)="usersSearchValueChanged($event)"
                        [column]="usersColumn"
                        [options]="usersOptions() | filter: usersSearchTerm():'label'"
                        [value]="usersFilters()"
                        class="hidden"></sm-table-filter-sort>

  <hr/>
  <button mat-menu-item
    [disabled]="!(showOnlyUserWork() ||  (tagsFilters()?.length > 0) || (usersFilters()?.length > 0))"
    smClickStopPropagation
    class="user-filter-button"
    (click)="clearAll()"
  >
    <div class="lbl" data-id="clearAllFilter">清除全部</div>
  </button>
</mat-menu>
